<!-- Shared verbatim with ../figma-copy-styles/ui.html. Edit both. -->
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; gap: 8px; padding: 8px;
    font: 11px/16px Inter, system-ui, sans-serif;
    color: var(--figma-color-text, #000);
    background: var(--figma-color-bg, #fff);
  }
  .bar { display: flex; gap: 6px; align-items: center; }
  select, button {
    font: inherit; height: 28px; padding: 0 8px; border-radius: 4px;
    color: inherit; background: var(--figma-color-bg, #fff);
    border: 1px solid var(--figma-color-border, #e6e6e6);
  }
  button { cursor: pointer; }
  #copy {
    margin-left: auto; font-weight: 600; border-color: transparent;
    color: var(--figma-color-text-onbrand, #fff);
    background: var(--figma-color-bg-brand, #0d99ff);
  }
  button:disabled { opacity: .4; cursor: default; }
  textarea {
    flex: 1; width: 100%; resize: none; padding: 8px; border-radius: 4px;
    font: 11px/16px ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre; overflow: auto; tab-size: 2;
    color: inherit; background: var(--figma-color-bg-secondary, #f5f5f5);
    border: 1px solid var(--figma-color-border, #e6e6e6);
  }
  #status { min-height: 16px; color: var(--figma-color-text-secondary, #666); }
  #status.error { color: var(--figma-color-text-danger, #e03e1a); }
</style>

<div class="bar">
  <select id="format" title="Output format">
    <option value="json">JSON</option>
    <option value="css">CSS</option>
  </select>
  <button id="refresh" title="Read the file again">Refresh</button>
  <button id="copy" disabled>Copy</button>
</div>
<textarea id="out" readonly spellcheck="false">Reading…</textarea>
<div id="status"></div>

<script>
  // The data arrives by postMessage and goes in through .value, never
  // innerHTML, so nothing in a name or description can break the page.
  var outputs = null;
  var out = document.getElementById("out");
  var format = document.getElementById("format");
  var copy = document.getElementById("copy");
  var status = document.getElementById("status");
  var summary = "";

  function say(text, isError) {
    status.textContent = text;
    status.className = isError ? "error" : "";
  }
  function show() {
    out.value = outputs ? outputs[format.value] : out.value;
    out.scrollTop = 0;
  }

  onmessage = function (event) {
    var msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.error) {
      outputs = null;
      copy.disabled = true;
      out.value = msg.error;
      say("Failed — the message above says why.", true);
      return;
    }
    outputs = msg.outputs;
    summary = msg.summary;
    copy.disabled = false;
    show();
    say(summary);
  };

  format.onchange = show;

  document.getElementById("refresh").onclick = function () {
    copy.disabled = true;
    out.value = "Reading…";
    say("");
    parent.postMessage({ pluginMessage: { type: "refresh" } }, "*");
  };

  // Figma's iframe blocks navigator.clipboard; execCommand still works there.
  // If it ever doesn't, the text is left selected for a manual Cmd/Ctrl+C.
  copy.onclick = function () {
    out.focus();
    out.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    var lines = out.value.split("\n").length.toLocaleString();
    say(ok
      ? "Copied " + format.value.toUpperCase() + " — " + lines + " lines. " + summary
      : "Copy was blocked — the text is selected, press Cmd/Ctrl+C.", !ok);
  };
</script>
