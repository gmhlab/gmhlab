name: Release

# Publishes @gmhlab/tokens, @gmhlab/ui and @gmhlab/blocks to public npm.
#
# Trigger is a version tag, which matches the documented flow in README
# "Cutting a release": bump -> changelog -> commit -> tag -> `git push --follow-tags`.
# The push of the tag is what starts this job.
#
# Requires one repository secret: NPM_TOKEN — a *granular* access token scoped to
# the @gmhlab org with read+write on the three packages. Granular tokens bypass
# the account's auth-and-writes 2FA, which is what makes an unattended publish
# possible at all; an interactive OTP cannot work here.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve, build and pack without publishing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # mint the OIDC token npm provenance is signed with
    steps:
      - uses: actions/checkout@v7

      # Reads the version from `packageManager` in the root package.json (pnpm 11.18.0),
      # so the CI pnpm can never drift from the local one.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm # keys off a hash of the (tracked) pnpm-lock.yaml

      # --frozen-lockfile is CI's default, but state it explicitly: it is the
      # whole reason the lockfile is tracked. A release must build against the
      # versions that were tested, and this fails the run if the lockfile and
      # the manifests have drifted apart rather than silently re-resolving.
      - run: pnpm install --frozen-lockfile

      # Fail fast on a bad credential. `publish --dry-run` never contacts the
      # registry, so without this a dispatch run says nothing about whether
      # NPM_TOKEN works — the first real signal would be a 404 at publish time,
      # after a full build. whoami is a read: it cannot publish anything, and it
      # succeeds only if the token is valid, unexpired, and permitted to bypass
      # the account's auth-and-writes 2FA.
      - name: Verify npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      # Guard against a mistyped tag. The three packages release in lockstep, so
      # any one of them can stand in for the version; publishing a v0.1.2 tag from
      # a tree still at 0.1.1 would otherwise silently republish the old version
      # and fail late with EPUBLISHCONFLICT.
      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/ui/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package version $pkg"
            exit 1
          fi
          echo "tag v$tag matches package version $pkg"

      # Same order as `pnpm release`: typecheck needs the built dist/ .d.ts of
      # tokens and ui, because blocks and the apps type-check against the built
      # packages rather than source.
      - run: pnpm build
      - run: pnpm typecheck

      # `pnpm -r` walks the workspace in topological order, so tokens lands before
      # ui (whose manifest pins @gmhlab/tokens exactly) and ui before blocks.
      #
      # --no-git-checks: pnpm otherwise refuses to publish from a detached HEAD,
      # which is exactly what a tag checkout is.
      #
      # --provenance signs the release with the OIDC token above. It requires a
      # public package whose repository.url matches this repo — both hold here.
      # It is dropped on the dry-run path, which never reaches the registry and
      # so has nothing to attest.
      #
      # A tag push always publishes for real. Only workflow_dispatch can dry-run,
      # and it defaults to doing so — dispatch skips the tag-vs-version guard
      # above (there is no tag), so an unguarded manual run would otherwise
      # publish whatever version happened to be sitting in package.json.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry run — resolving and packing only, nothing is published"
            pnpm -r --filter "./packages/*" publish --access public --no-git-checks --dry-run
          else
            pnpm -r --filter "./packages/*" publish --access public --no-git-checks --provenance
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)." \
            --verify-tag
